paths:
  checkpoints: data/checkpoints
  default_checkpoint: data/checkpoints/cardiac_unet.pt

model:
  in_channels: 1
  out_channels: 4
  spatial_size: [64, 128, 128]
  channels: [16, 32, 64, 128]
  strides: [2, 2, 2]
  num_res_units: 2

preprocess:
  a_min: 0.0
  a_max: 2000.0
  b_min: 0.0
  b_max: 1.0

labels:
  0:
    name: Background
    color: [0.2, 0.2, 0.2]
    visible: false
  1:
    name: RV Cavity
    color: [0.25, 0.45, 0.85]
    visible: true
  2:
    name: LV Myocardium
    color: [0.95, 0.75, 0.35]
    visible: true
  3:
    name: LV Cavity
    color: [0.85, 0.2, 0.25]
    visible: true

visualization:
  background: [0.08, 0.09, 0.11]
  opacity: 0.85
